[package]
name = "anno-formats"
version = "0.1.0"
edition = "2024"
description = "Anno 117 and 1800 file formats: RDA archives, the layered install VFS, ADF record trees, islands and compiled Phoenix UI assets"

[dependencies]
anyhow = "1"
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Hash maps keyed by our own small values (layout caches).
foldhash = "0.2"
quick-xml = "0.39"
# The worker pool layout warms a screen's templates on.
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
