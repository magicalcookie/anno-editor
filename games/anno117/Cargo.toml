[package]
name = "anno117"
version = "0.1.0"
edition = "2024"

[dependencies]
anno-core = { path = "../../core" }
anno-render = { path = "../../render" }
anno-formats = { path = "../../formats" }
anyhow = "1"
# The river ripples ship as BC6H; decoded once to slopes (water::RiverWaves).
bcdec_rs = "0.2"
gpui-editor-kit = { path = "../../vendor/gpui-editor-kit" }
rayon = "1.12"
# The water pass's own pipelines, on GPUI's device: the kit's revision.
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007", default-features = false, features = ["wgsl", "std"] }
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
# examples/phx_named_ids.rs reads the component and effect JSON.
serde_json = "1"
