[package]
name = "anno1800"
version = "0.1.0"
edition = "2024"

[dependencies]
anno-core = { path = "../../core" }
anno-render = { path = "../../render" }
anno-formats = { path = "../../formats" }
anyhow = "1"
gpui-editor-kit = { path = "../../vendor/gpui-editor-kit" }
rayon = "1.12"
# The small waves ship as BC6H; decoded where the device lacks BC.
bcdec_rs = "0.2"
# The water pass's own pipelines, on GPUI's device: the kit's revision.
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007", default-features = false, features = ["wgsl", "std"] }
bytemuck = { version = "1", features = ["derive"] }
